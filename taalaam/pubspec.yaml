name: student_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  bloc: ^9.2.0
  chewie: ^1.13.0
  cloud_firestore: ^6.3.0
  device_preview: ^1.3.1
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.2.3
  gap: ^3.0.1
  go_router: ^14.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  loading_indicator: ^3.1.1
  lottie: ^3.3.1
  easy_localization: ^3.0.7

  pod_player: ^0.2.2
  video_player: ^2.10.1
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  


dev_dependencies: 
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.8
  hive_generator: ^2.0.1 

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translation/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/Fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/Fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/Fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/Fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/Fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/Fonts/Cairo-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/Fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/Fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/Fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/Fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/Fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/Fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/Fonts/Tajawal-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/Fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/Fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/Fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/Fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/Fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/Fonts/Inter_18pt-Black.ttf
          weight: 900
